<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><meta name="theme-color" content="#0b5cab"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Aventuras do Rick — RBR</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--b:#0b5cab;--bd:#083f78;--bl:#e6f0fb;--g:#5b6770;--gl:#eef1f4;--w:#fff;--ok:#2e9e5b;--bad:#e58a1f;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;color:#1d2b3a;background:linear-gradient(#cfe4fa,#f4f8fc 60%,#dfe5ea)}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
header{background:var(--b);display:flex;align-items:center;justify-content:space-between;padding:8px 16px;box-shadow:0 3px 0 var(--bd)}
header img{height:34px}header span{color:#fff;font-weight:800;font-size:18px;letter-spacing:.5px}
main{max-width:1000px;margin:0 auto;padding:14px}
.screen{display:none}.screen.on{display:block;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
h1{font-size:clamp(34px,8vw,64px);line-height:1;margin:6px 0;color:var(--bd);text-align:center;font-weight:800;text-shadow:0 3px 0 #fff}
h2{margin:6px 0;color:var(--bd);font-size:clamp(22px,5vw,32px);text-align:center}
.sub{text-align:center;font-size:clamp(18px,4vw,26px);color:var(--g);margin:0 0 12px}
.photo{display:block;margin:8px auto;max-width:100%;border-radius:22px;border:5px solid #fff;box-shadow:0 8px 0 var(--bd)}
.big{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:14px}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.bt{border:0;border-radius:24px;padding:14px 22px;font-size:clamp(18px,4.5vw,24px);font-weight:800;color:#fff;background:var(--b);box-shadow:0 6px 0 var(--bd);min-height:56px;transition:transform .1s}
.bt:active{transform:translateY(4px);box-shadow:0 2px 0 var(--bd)}
.bt.g{background:var(--g);box-shadow:0 6px 0 #3b454c}.bt.ok{background:var(--ok);box-shadow:0 6px 0 #1d6b3c}
.card{flex:1 1 280px;max-width:440px;border-radius:28px;padding:20px 16px;text-align:center;color:#fff;font-weight:800;font-size:clamp(26px,6vw,40px);background:var(--b);box-shadow:0 9px 0 var(--bd);border:0}
.card small{display:block;font-size:clamp(16px,3.6vw,20px);font-weight:500;margin-top:4px}
.card.alt{background:var(--g);box-shadow:0 9px 0 #3b454c}.card:active{transform:translateY(5px)}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-bottom:8px}
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:14px}
.gal button{background:#fff;border:5px solid var(--b);border-radius:24px;padding:10px;font-size:22px;font-weight:800;color:var(--bd);box-shadow:0 6px 0 var(--bd)}
.gal img{width:100%;height:180px;object-fit:contain;display:block;margin-bottom:6px;background:#fff;border-radius:12px}
#wrap{background:#fff;border-radius:18px;border:4px solid var(--b);text-align:center;padding:4px}
#cv{max-width:100%;max-height:68vh;touch-action:manipulation;cursor:crosshair}
.pal{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.sw{width:46px;height:46px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px #9aa6b0;padding:0}
.sw.sel{box-shadow:0 0 0 5px var(--b);transform:scale(1.15)}
.sw.er{background:#fff;font-size:22px}
.tools{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tools .bt{padding:10px 16px;font-size:18px;min-height:48px}
.modal{position:fixed;inset:0;background:rgba(8,63,120,.6);display:none;align-items:center;justify-content:center;z-index:9}
.modal.on{display:flex}.modal div{background:#fff;border-radius:26px;padding:24px;text-align:center;max-width:90%;font-size:22px;font-weight:700}
.steps{display:flex;gap:6px;justify-content:center;margin:4px 0 10px}
.steps i{width:38px;height:12px;border-radius:8px;background:#c4ccd4}.steps i.d{background:var(--b)}.steps i.c{background:#f5b800}
.say{background:#fff;border:4px solid var(--b);border-radius:22px;padding:12px 16px;font-size:clamp(18px,4.3vw,26px);font-weight:700;text-align:center;margin:8px auto;max-width:720px}
#msg{min-height:42px;text-align:center;font-size:clamp(18px,4vw,24px);font-weight:800;margin:6px 0}
#msg.good{color:var(--ok)}#msg.bad{color:var(--bad)}
.stage{position:relative;border-radius:22px;overflow:hidden;border:5px solid #fff;box-shadow:0 8px 0 var(--bd);background:#bfe0fa}
.stage svg{display:block;width:100%;height:auto}
.hit{cursor:pointer}.hit:hover{filter:brightness(1.08)}
.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.pulse{animation:pu 1s infinite}@keyframes pu{50%{transform:scale(1.05)}}
#drive{position:relative;height:clamp(230px,48vw,340px);background:linear-gradient(#bfe0fa 0 58%,#8c9aa5 58%)}
#road{position:absolute;left:0;right:0;bottom:18%;height:3px;border-top:5px dashed #fff;opacity:.8}
#dcar{position:absolute;left:2%;bottom:12%;width:30%;transition:left .12s linear}
#dstore{position:absolute;right:0;top:4%;width:36%}
#spot{position:absolute;left:46%;bottom:9%;width:34%;height:8%;border:4px dashed #f5b800;border-radius:10px}
#rk{position:absolute;width:15%;aspect-ratio:1;border-radius:50%;border:5px solid #fff;object-fit:cover;object-position:50% 20%;box-shadow:0 5px 0 var(--bd);display:none;bottom:22%;transition:left 1.6s ease-in-out,bottom 1.6s}
.medal{width:150px;margin:0 auto;display:block}
.star{display:inline-block;font-size:56px;animation:pop .6s both}@keyframes pop{from{transform:scale(0) rotate(-90deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:760px){
html,body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
header{padding:6px 12px;position:sticky;top:0;z-index:5}header img{height:28px}header span{font-size:15px}
main{padding:8px 10px 14px}
h1{font-size:clamp(30px,10vw,46px)}.sub{font-size:17px;margin:0 0 8px}
.photo{width:100%!important;border-width:4px;box-shadow:0 5px 0 var(--bd)}
.big{flex-direction:column;gap:14px;margin-top:12px}.big .bt,.card{width:100%;max-width:none;flex:none}
.card{padding:18px 12px;font-size:30px}
.bar{gap:8px;flex-wrap:nowrap;margin-bottom:6px}.bar .bt{flex:1;padding:8px 10px;font-size:15px;min-height:48px;border-radius:18px;box-shadow:0 4px 0 #3b454c}
.gal{grid-template-columns:1fr;gap:12px}.gal button{display:flex;align-items:center;gap:12px;text-align:left;padding:8px;font-size:21px}
.gal img{width:96px;height:96px;margin:0;flex:none}
#paint.on{display:flex;flex-direction:column;height:calc(100dvh - 54px - env(safe-area-inset-top,0px));padding-bottom:0}
#wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:2px;border-width:3px}
#cv{max-width:100%;max-height:100%;width:auto;height:auto;touch-action:manipulation}
#paint .sub{display:none}
.dock{background:#fff;border-radius:20px 20px 0 0;margin:6px -10px 0;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 12px rgba(8,63,120,.2)}
.pal{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;margin:0 0 8px;padding:8px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pal::-webkit-scrollbar{display:none}.sw{flex:none;width:52px;height:52px}
.tools{flex-wrap:nowrap;gap:8px}.tools .bt{flex:1;padding:8px 6px;font-size:15px;min-height:52px}
.say{font-size:19px;padding:10px 12px;margin:6px 0}h2{font-size:21px}
.steps i{width:30px}
.stage{border-width:4px}
#go{width:100%;min-height:78px;font-size:24px;touch-action:none}
#msg{position:sticky;bottom:0;background:rgba(255,255,255,.92);border-radius:16px;padding:6px;font-size:19px}
#game .bar .bt{flex:none;min-height:44px;padding:6px 14px}
.modal div{width:90%;font-size:20px}.modal .bt{width:100%;margin-top:10px}
}
.vid{width:100%;display:block;aspect-ratio:16/9;background:#000}
</style></head><body>

<path d="M690 340H745V374H690Z" ${S}/><path d="M60 345H110V374H60Z" ${S}/>
<circle cx="190" cy="378" r="62" ${S}/><circle cx="190" cy="378" r="36" ${S}/><circle cx="190" cy="378" r="12" ${S}/>
<circle cx="620" cy="378" r="62" ${S}/><circle cx="620" cy="378" r="36" ${S}/><circle cx="620" cy="378" r="12" ${S}/></svg>`;
let aw='';for(let i=0;i<6;i++){const x=100+i*100;aw+=`<path d="M${x} 205H${x+100}L${x+108} 240H${x-8}Z" ${S}/>`}
const shopSVG=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520">${sky}<rect x="-5" y="440" width="810" height="90" ${S}/>
<rect x="100" y="150" width="600" height="292" ${S}/><rect x="150" y="70" width="500" height="85" rx="10" ${S}/>
<circle cx="205" cy="112" r="28" ${S}/><circle cx="205" cy="112" r="11" ${S}/>
<text x="250" y="130" font-size="52" font-weight="800" font-family="Arial Black,Arial,sans-serif" fill="#fff" stroke="#111" stroke-width="2">AUTOPEÇAS</text>
${aw}<rect x="130" y="260" width="190" height="130" ${S}/><rect x="480" y="260" width="190" height="130" ${S}/>
<rect x="350" y="255" width="100" height="187" ${S}/><rect x="364" y="272" width="72" height="85" ${S}/><circle cx="437" cy="380" r="7" ${S}/>
<circle cx="735" cy="410" r="30" ${S}/><circle cx="735" cy="410" r="11" ${S}/><circle cx="735" cy="365" r="30" ${S}/><circle cx="735" cy="365" r="11" ${S}/>
<path d="M40 440L65 390 90 440Z" ${S}/></svg>`;
const uri=s=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
const DR={rick:{src:IMG.rick,w:640,h:960},car:{src:uri(carSVG),w:800,h:520},shop:{src:uri(shopSVG),w:800,h:520}};
$('#thCar').src=DR.car.src;$('#thShop').src=DR.shop.src;

/* ---------- pintura: preenchimento por região (flood fill) ---------- */
const cv=$('#cv'),ctx=cv.getContext('2d',{willReadFrequently:true});
const COLORS=['#e53935','#fb8c00','#fdd835','#7cb342','#2e9e5b','#00acc1','#0b5cab','#1e2f97','#8e24aa','#ec407a','#6d4c41','#9e9e9e','#212121','#f8c9a0'];
let cur=COLORS[0],eraser=false,lum=null,open=null,undoS=[],curDraw=null;
const pal=$('#pal');
COLORS.forEach(c=>{const b=document.createElement('button');b.className='sw';b.style.background=c;b.setAttribute('aria-label','Cor '+c);b.onclick=()=>pick(b,c,false);pal.appendChild(b)});
const er=document.createElement('button');er.className='sw er';er.textContent='⬜';er.title='Borracha';er.setAttribute('aria-label','Borracha');er.onclick=()=>pick(er,'#fff',true);pal.appendChild(er);
function pick(b,c,e){cur=c;eraser=e;pal.querySelectorAll('.sw').forEach(x=>x.classList.toggle('sel',x===b))}
pal.firstChild.classList.add('sel');
function rgb(h){const n=parseInt(h.slice(1),16);return[n>>16,n>>8&255,n&255]}
function load(k){
 curDraw=k;const d=DR[k];const im=new Image();
 im.onload=()=>{cv.width=d.w;cv.height=d.h;ctx.fillStyle='#fff';ctx.fillRect(0,0,d.w,d.h);ctx.drawImage(im,0,0,d.w,d.h);
  const px=ctx.getImageData(0,0,d.w,d.h).data;lum=new Uint8Array(d.w*d.h);open=new Uint8Array(d.w*d.h);
  for(let i=0;i<lum.length;i++){lum[i]=px[i*4];open[i]=px[i*4]>128?1:0}
  undoS=[];};
 im.src=d.src;show('paint');
}
document.querySelectorAll('[data-draw]').forEach(b=>b.onclick=()=>load(b.dataset.draw));
$('#toGal').onclick=()=>show('gallery');
function fill(x,y){
 const w=cv.width,h=cv.height;let s=-1;
 for(let r=0;r<=4&&s<0;r++)for(let dy=-r;dy<=r&&s<0;dy++)for(let dx=-r;dx<=r;dx++){const xx=x+dx,yy=y+dy;if(xx>=0&&yy>=0&&xx<w&&yy<h&&open[yy*w+xx]){s=yy*w+xx;break}}
 if(s<0)return;
 const img=ctx.getImageData(0,0,w,h);undoS.push(new Uint8ClampedArray(img.data));if(undoS.length>15)undoS.shift();
 const d=img.data,c=rgb(cur),seen=new Uint8Array(w*h),st=[s];seen[s]=1;
 while(st.length){const i=st.pop(),l=lum[i],o=i*4;
  d[o]=c[0]*l/255;d[o+1]=c[1]*l/255;d[o+2]=c[2]*l/255;
  const px=i%w;
  if(px>0&&!seen[i-1]&&open[i-1]){seen[i-1]=1;st.push(i-1)}
  if(px<w-1&&!seen[i+1]&&open[i+1]){seen[i+1]=1;st.push(i+1)}
  if(i>=w&&!seen[i-w]&&open[i-w]){seen[i-w]=1;st.push(i-w)}
  if(i<w*(h-1)&&!seen[i+w]&&open[i+w]){seen[i+w]=1;st.push(i+w)}}
 ctx.putImageData(img,0,0);buzz(15);
}
cv.addEventListener('pointerdown',e=>{if(!open)return;e.preventDefault();const r=cv.getBoundingClientRect();
 fill(Math.floor((e.clientX-r.left)*cv.width/r.width),Math.floor((e.clientY-r.top)*cv.height/r.height))});
$('#undo').onclick=()=>{const p=undoS.pop();if(p)ctx.putImageData(new ImageData(p,cv.width,cv.height),0,0)};
$('#clear').onclick=()=>$('#modal').classList.add('on');
$('#no').onclick=()=>$('#modal').classList.remove('on');
$('#yes').onclick=()=>{$('#modal').classList.remove('on');if(curDraw)load(curDraw)};

/* ---------- jogo ---------- */
const P=$('#phase'),M=$('#msg');let ph=0,drv=null;
function buzz(n){try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}}
function msg(t,c){M.textContent=t;M.className=c||''}
function steps(n){$('#steps').innerHTML=[1,2,3,4,5].map(i=>`<i class="${i<n?'d':i==n?'c':''}"></i>`).join('')}
function stopDrive(){if(drv){clearInterval(drv);drv=null}}
function playSeq(list,cb){let i=0,done=false;const st=P.querySelector('.stage');st.style.cssText='background:#000;padding:0';st.innerHTML='<video class="vid" playsinline preload="auto"></video>';const v=st.firstChild;
 const fin=()=>{if(done)return;done=true;stopDrive();cb()};
 const next=()=>{if(i>=list.length)return fin();v.src=''+list[i++];v.play().catch(()=>{v.controls=true})};
 v.onended=next;v.onerror=fin;next();
 const b=document.createElement('div');b.className='big';b.innerHTML='<button class="bt g">PULAR ▶</button>';P.appendChild(b);b.firstChild.onclick=fin}
function say(t){return `<div class="say">${t}</div>`}
function phase(n){
 ph=n;stopDrive();steps(n);msg('');
 if(n==1){P.innerHTML=`<h2>Fase 1 — Receba sua missão</h2><div class="stage" style="background:#000"><video class="vid" src="01-missao.mp4" poster="poster-01.jpg" playsinline preload="auto" controls></video></div>`+say('“Olá! Temos uma missão para cumprir. Vamos visitar uma loja de autopeças. Você está pronto para me ajudar?”')+`<div class="big"><button class="bt ok" id="n1">COMEÇAR MISSÃO ▶</button></div>`;$('#n1').onclick=()=>phase(2);const v=P.querySelector('video');if(v)v.play().catch(()=>{})}
 if(n==2){P.innerHTML=`<h2>Fase 2 — Prepare-se para sair</h2>`+say('Encontre o carro da RBR e prepare o Rick para a visita.')+`<div class="stage" style="background:#cfe4fa;padding:18px;text-align:center"><img id="pc" class="hit pulse" src="${IMG.car}" alt="Carro da RBR" style="width:min(520px,90%)"></div>`;msg('👆 Toque no carro da RBR!');
  $('#pc').onclick=()=>{msg('Muito bem! Veja o Rick se preparando... 🎬','good');playSeq(['03-caminhando-ate-o-carro.mp4','02-preparando-missao.mp4'],()=>phase(3))}}
 if(n==3){document.addEventListener('contextmenu',e=>e.preventDefault());
  const shops=[['Padaria','#e8a54b',60,'🥖'],['Farmácia','#2e9e5b',250,'💊'],['AUTOPEÇAS','#0b5cab',440,'🛞'],['Escola','#c4553a',640,'📚']];
  P.innerHTML=`<h2>Fase 3 — Encontre o destino</h2>`+say('Qual é a loja de autopeças? Toque nela!')+`<div class="stage"><svg viewBox="0 0 900 400"><rect width="900" height="400" fill="#bfe0fa"/><circle cx="820" cy="60" r="34" fill="#ffd54f"/><rect y="290" width="900" height="110" fill="#8c9aa5"/><rect y="285" width="900" height="14" fill="#cfd6dc"/><path d="M0 360H900" stroke="#fff" stroke-width="6" stroke-dasharray="40 30"/>`+
  shops.map((s,i)=>`<g class="hit" data-s="${i}"><rect x="${s[2]}" y="110" width="190" height="175" rx="8" fill="${s[1]}" stroke="#fff" stroke-width="5"/><rect x="${s[2]+15}" y="150" width="70" height="75" fill="#e8f4ff" opacity=".9"/><rect x="${s[2]+110}" y="170" width="55" height="115" fill="#263a4d"/><rect x="${s[2]}" y="72" width="190" height="42" rx="8" fill="#fff" stroke="${s[1]}" stroke-width="5"/><text x="${s[2]+95}" y="102" text-anchor="middle" font-size="${i==2?21:24}" font-weight="800" font-family="Baloo 2,Arial" fill="${s[1]}">${s[0]}</text><text x="${s[2]+50}" y="205" text-anchor="middle" font-size="40">${s[3]}</text></g>`).join('')+`</svg></div>`;
  let err=0;P.querySelectorAll('[data-s]').forEach(g=>g.onclick=()=>{
   if(g.dataset.s==2){buzz(60);msg('Isso mesmo! Esta é a loja de autopeças! 🎉','good');P.querySelectorAll('[data-s]').forEach(x=>x.onclick=null);setTimeout(()=>phase(4),1200)}
   else{err++;buzz([40,40,40]);msg(err>1?'Quase! Procure a loja com uma roda 🛞 e o nome AUTOPEÇAS.':'Ops! Aqui não é a loja de autopeças. Tente de novo! 🙂','bad');const st=P.querySelector('.stage');st.classList.remove('shake');void st.offsetWidth;st.classList.add('shake')}})}
 if(n==4){P.innerHTML=`<h2>Fase 4 — Chegue à loja</h2>`+say('Segure o botão para dirigir até a vaga amarela. Depois, leve o Rick até a porta!')+
  `<div class="stage"><div id="drive"><div id="dstore">${shopSVG.replace(/<rect x="-5"[^>]*\/>/g,'').replace(/<circle cx="90"[^>]*\/>|<path d="M560[^>]*\/>/g,'')}</div><div id="road"></div><div id="spot"></div><img id="dcar" src="${IMG.car}" alt="Carro da RBR"><img id="rk" src="${IMG.face}" alt="Rick" class="hit"></div></div>`+
  `<div class="big"><button class="bt" id="go">🚗 SEGURE PARA ANDAR ▶</button></div>`;
  msg('Segure o botão e leve o carro até a vaga!');let x=2;const car=$('#dcar');
  const step=()=>{x=Math.min(x+1.4,46);car.style.left=x+'%';if(x>=46)arrive()};
  const start=e=>{e.preventDefault();if(x>=46||drv)return;step();drv=setInterval(step,60)},end=()=>stopDrive();
  const go=$('#go');go.onpointerdown=start;['pointerup','pointerleave','pointercancel'].forEach(t=>go.addEventListener(t,end));
  go.onkeydown=e=>{if(e.key==' '||e.key=='Enter')step()};
  function arrive(){stopDrive();go.style.display='none';msg('Chegamos! Agora toque no Rick para ele ir até a porta! 👆','good');
   const rk=$('#rk');rk.style.display='block';rk.style.left='44%';rk.classList.add('pulse');
   rk.onclick=()=>{rk.onclick=null;msg('Lá vai o Rick até a loja! 🚶','good');playSeq(['04-entrando-na-loja.mp4'],()=>{msg('O Rick chegou à entrada da loja! 🎉','good');setTimeout(()=>phase(5),900)})}}}
 if(n==5){steps(6);P.innerHTML=`<h2>Fase 5 — Cumpra a missão</h2>`+say('Parabéns! Você encontrou a loja de autopeças. Missão cumprida!')+
  `<div style="text-align:center"><img class="photo" src="poster-05.jpg" alt="Rick dentro da loja" style="width:min(520px,100%)"><br><span class="star">⭐</span><span class="star" style="animation-delay:.2s">⭐</span><span class="star" style="animation-delay:.4s">⭐</span>
  <svg class="medal" viewBox="0 0 100 120"><path d="M25 0l25 45 25-45z" fill="#0b5cab"/><circle cx="50" cy="72" r="38" fill="#f5b800" stroke="#c98f00" stroke-width="5"/><circle cx="50" cy="72" r="28" fill="#ffd54f"/><path d="M34 72l11 11 22-24" stroke="#0b5cab" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="big"><button class="bt ok" id="again">🔄 JOGAR NOVAMENTE</button><button class="bt g" data-go="menu">🏠 VOLTAR AO MENU</button></div>`;
  $('#again').onclick=()=>phase(1);P.querySelector('[data-go]').onclick=()=>show('menu');msg('Missão concluída! 🏅','good')}
}
})();
</script></body></html>
